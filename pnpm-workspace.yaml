packages:
  - apps/*
  - packages/*
overrides:
  # Transitive, via @modelcontextprotocol/sdk > ajv. Pinned forward to the
  # patched releases; each stays within the major its parent declares, so
  # no API break. fast-uri: GHSA-4c8g-83qw-93j6 (host confusion).
  # ip-address: leading-zero octet decoding.
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lenis@1.3.25
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2
